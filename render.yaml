services:
  - type: web
    name: filings-mcp
    runtime: python
    plan: free
    buildCommand: pip install -e ".[mcp]"
    startCommand: filings-mcp --transport sse --root /data/FilingsLibrary
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.11.0
    disk:
      name: filings-data
      mountPath: /data
      sizeGB: 10
