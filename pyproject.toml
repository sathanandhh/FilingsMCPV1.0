[project]
name = "filingsmcp"
version = "0.1.0"
description = "Filing engine for Indian stocks"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["httpx==0.27.2", "pypdf==4.3.1"]

[project.optional-dependencies]
api = ["fastapi==0.115.5", "uvicorn[standard]==0.32.1"]
mcp = ["mcp>=1.0.0"]
dev = ["pytest==8.3.3", "fastapi==0.115.5", "uvicorn[standard]==0.32.1"]

[project.scripts]
filings-mcp = "mcp_server.server:main"

[tool.setuptools.packages.find]
include = ["engine*", "api*", "mcp_server*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
